<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroScope 3D — NIfTI Upload & Validation Module</title>
  <style>
:root {
  --bg-primary: #0b0f19;
  --bg-surface: #111827;
  --bg-card: #1f2937;
  --border-color: #374151;
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --accent-cyan: #06b6d4;
  --accent-blue: #3b82f6;

  /* Status Colors required by spec */
  --status-gray: #6b7280;
  --status-blue: #3b82f6;
  --status-yellow: #f59e0b;
  --status-green: #10b981;
  --status-red: #ef4444;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
}

.neuroscope-app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.25rem 2rem;
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.brand-icon {
  font-size: 2.2rem;
}

.brand-title {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: #ffffff;
}

.brand-subtitle {
  font-size: 0.85rem;
  color: var(--accent-cyan);
}

.header-badge {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.35rem 0.75rem;
  background: rgba(6, 182, 212, 0.1);
  color: var(--accent-cyan);
  border: 1px solid rgba(6, 182, 212, 0.3);
  border-radius: 9999px;
}

.app-main-content {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 2rem;
}

/* Medical Disclaimer Banner */
.medical-disclaimer-banner {
  background-color: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  margin-bottom: 2rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.disclaimer-badge {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--status-yellow);
}

.disclaimer-text {
  font-size: 0.875rem;
  color: #fcd34d;
}

/* Section Header */
.section-header {
  margin-bottom: 1.5rem;
}

.section-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.section-description {
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* Upload Slots Grid (4 slots) */
.upload-slots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

.upload-slot-card {
  background-color: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 10px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  transition: all 0.2s ease;
  min-height: 250px;
}

/* Status color classes */
.upload-slot-card.status-idle {
  border-color: var(--border-color);
}

.upload-slot-card.status-uploading {
  border-color: var(--status-blue);
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
}

.upload-slot-card.status-validating {
  border-color: var(--status-yellow);
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
}

.upload-slot-card.status-valid {
  border-color: var(--status-green);
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
}

.upload-slot-card.status-invalid {
  border-color: var(--status-red);
  box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
}

.upload-slot-card.drag-over {
  border-color: var(--accent-cyan);
  background-color: rgba(6, 182, 212, 0.05);
}

.slot-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1rem;
}

.slot-title-area {
  display: flex;
  flex-direction: column;
}

.slot-modality-label {
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
}

.slot-seq-desc {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Badges */
.badge {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
}

.badge-gray {
  background-color: rgba(107, 114, 128, 0.2);
  color: #9ca3af;
}

.badge-blue {
  background-color: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
}

.badge-yellow {
  background-color: rgba(245, 158, 11, 0.2);
  color: #fbbf24;
}

.badge-green {
  background-color: rgba(16, 185, 129, 0.2);
  color: #34d399;
}

.badge-red {
  background-color: rgba(239, 68, 68, 0.2);
  color: #f87171;
}

/* Dropzone Empty State */
.dropzone-empty {
  flex: 1;
  border: 1px dashed var(--border-color);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 0.75rem;
  cursor: pointer;
  background-color: rgba(0, 0, 0, 0.15);
  transition: background-color 0.15s ease;
}

.dropzone-empty:hover {
  background-color: rgba(255, 255, 255, 0.03);
}

.drop-icon {
  font-size: 1.75rem;
  margin-bottom: 0.5rem;
  color: var(--text-muted);
}

.drop-text {
  font-size: 0.85rem;
  font-weight: 500;
  text-align: center;
}

.drop-subtext {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
}

.accepted-formats {
  font-size: 0.7rem;
  color: var(--accent-cyan);
  margin-top: 0.75rem;
}

.hidden-file-input {
  display: none;
}

/* File info container */
.file-info-container {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.file-details {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background-color: rgba(0, 0, 0, 0.2);
  padding: 0.75rem;
  border-radius: 6px;
}

.file-icon {
  font-size: 1.5rem;
}

.file-texts {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.filename {
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.filesize {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.slot-metadata-pills {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.meta-pill {
  font-size: 0.75rem;
  background-color: rgba(255, 255, 255, 0.05);
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  color: #e5e7eb;
}

.slot-error-banner {
  background-color: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
}

.error-icon {
  color: var(--status-red);
}

.error-text {
  font-size: 0.75rem;
  color: #fca5a5;
  line-height: 1.35;
}

.slot-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.btn-replace, .btn-remove {
  padding: 0.35rem 0.75rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: opacity 0.15s;
}

.btn-replace {
  background-color: #374151;
  color: #ffffff;
}

.btn-remove {
  background-color: rgba(239, 68, 68, 0.2);
  color: #fca5a5;
}

.slot-footer {
  margin-top: auto;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border-color);
}

.modality-select-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.modality-dropdown {
  background-color: #111827;
  color: #f9fafb;
  border: 1px solid var(--border-color);
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
}

/* Action Bar */
.validation-actions-bar {
  display: flex;
  justify-content: center;
  margin: 1.5rem 0;
}

.btn-primary-action {
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color: #ffffff;
  font-size: 1rem;
  font-weight: 600;
  padding: 0.85rem 2rem;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-primary-action:disabled {
  background: #374151;
  color: #9ca3af;
  cursor: not-allowed;
  box-shadow: none;
}

/* Study Error Alert */
.study-error-alert {
  background-color: rgba(239, 68, 68, 0.1);
  border: 1px solid var(--status-red);
  border-radius: 8px;
  padding: 1.25rem;
  margin: 1.5rem 0;
  display: flex;
  gap: 1rem;
}

.alert-title {
  font-size: 1rem;
  font-weight: 700;
  color: #f87171;
  margin-bottom: 0.25rem;
}

.alert-msg {
  font-size: 0.875rem;
  color: #fecaca;
}

.alert-details {
  margin-top: 0.5rem;
  background-color: rgba(0, 0, 0, 0.3);
  padding: 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  color: #d1d5db;
}

/* Validation Summary Card */
.validation-summary-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--status-green);
  border-radius: 12px;
  padding: 1.75rem;
  margin-top: 2rem;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
}

.summary-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 1rem;
  margin-bottom: 1.25rem;
}

.summary-status-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.check-icon {
  font-size: 1.25rem;
  color: var(--status-green);
  font-weight: bold;
}

.summary-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
}

.study-id-tag {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.study-id-tag code {
  background-color: var(--bg-card);
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  color: var(--accent-cyan);
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.summary-metric {
  background-color: var(--bg-card);
  padding: 0.85rem;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.metric-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.metric-value {
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
}

.highlight-green {
  color: var(--status-green);
}

.summary-footer {
  display: flex;
  justify-content: flex-end;
}

.btn-proceed-segmentation {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #ffffff;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 0.85rem 2rem;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Segmentation Results */
.segmentation-result-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--accent-cyan);
  border-radius: 12px;
  padding: 1.75rem;
  margin-top: 2rem;
}

.seg-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}

.seg-title {
  font-size: 1.25rem;
  font-weight: 700;
}

.model-badge {
  background-color: rgba(6, 182, 212, 0.15);
  color: var(--accent-cyan);
  padding: 0.25rem 0.75rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
}

.seg-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.volumetrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.volumetric-box {
  padding: 1.25rem;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
}

.wt-box {
  background-color: rgba(59, 130, 246, 0.15);
  border: 1px solid #3b82f6;
}

.tc-box {
  background-color: rgba(245, 158, 11, 0.15);
  border: 1px solid #f59e0b;
}

.et-box {
  background-color: rgba(239, 68, 68, 0.15);
  border: 1px solid #ef4444;
}

.vol-title {
  font-size: 0.9rem;
  font-weight: 700;
}

.vol-sub {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.vol-value {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 0.25rem;
}

.voxel-count {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.btn-secondary {
  background-color: #374151;
  color: #ffffff;
  padding: 0.65rem 1.25rem;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

/* Spinner */
.spinner, .spinner-sm {
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-left-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner {
  width: 18px;
  height: 18px;
}

.spinner-sm {
  width: 12px;
  height: 12px;
  display: inline-block;
  vertical-align: middle;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.app-footer {
  text-align: center;
  padding: 1.5rem;
  border-top: 1px solid var(--border-color);
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: auto;
}

  </style>
